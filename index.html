<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="style.css">

  <nav id="toc" aria-label="On this page"></nav>

    <div id="content"></div>
  </main>
</div>
<footer class="foot"><div class="wrap" id="foot"></div></footer>
<button id="up" class="ghost" type="button" hidden>&uarr; Top</button>
